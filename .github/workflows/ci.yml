name: CI

on:
  push:
    branches: [main, overhaul-margin]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # A budget nobody measures is a wish. This fails the build if the
      # first-load JS on any prerendered route crosses the ceiling.
      #
      # It reads the chunks each route's HTML actually references, rather
      # than summing every file in .next/static/chunks. The earlier version
      # of this step did the latter, which is not "JS on a route" at all:
      # it added the chunks for /work and /work/[slug] to the homepage's and
      # reported 216 KB for a page that loads 194 KB.
      #
      # Measured 2026-09-30 on Next 16.2.9 / React 19.3.0: every real route
      # lands at 194.5 KB gz, and /_global-error — which carries essentially
      # no app code — lands at 185.5 KB. So ~185 KB is the framework floor
      # and this site adds about 9 KB of its own. The ceiling is a tripwire
      # for accidentally pulling in a heavy client dependency, not a target.
      # If a future Next lowers the floor, lower this with it.
      - name: JS budget
        run: |
          python3 - <<'PY'
          import glob, gzip, os, re, pathlib, sys

          LIMIT = 215_040  # 210 KB
          worst = 0
          for h in sorted(glob.glob(".next/server/app/**/*.html", recursive=True)):
              refs = set(re.findall(r'/_next/(static/chunks/[^"\'?]+\.js)',
                                    pathlib.Path(h).read_text(errors="ignore")))
              total = sum(len(gzip.compress(pathlib.Path(os.path.join(".next", r)).read_bytes(), 9))
                          for r in refs if os.path.exists(os.path.join(".next", r)))
              route = h.replace(".next/server/app", "").replace(".html", "") or "/"
              print(f"{total:>8} B gz  {len(refs):>2} chunks  {route}")
              worst = max(worst, total)

          if not worst:
              print("::error::JS budget found no prerendered routes to measure")
              sys.exit(1)
          print(f"worst route: {worst} B gz (limit {LIMIT})")
          if worst > LIMIT:
              print(f"::error::JS budget exceeded: {worst} > {LIMIT}")
              sys.exit(1)
          PY
